name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The unit tests cover the parts of the backend that do not need a GPU, so they
  # run on a stock runner. This is the job that guards core/crypto and the frame queue.
  unit-tests:
    name: Unit tests (no GPU required)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install CMake and Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Configure
        run: cmake -S tests -B build/tests -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build/tests -j"$(nproc)"

      - name: Test
        run: ctest --test-dir build/tests --output-on-failure

      - name: Build through the project's own test target
        run: |
          cmake -S tests -B build/tests-standalone -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/tests-standalone -j"$(nproc)"
          ctest --test-dir build/tests-standalone --output-on-failure

  # Formatting is enforced so review diffs stay about behaviour. third_party/ is
  # excluded through third_party/.clang-format.
  formatting:
    name: clang-format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # Pinned deliberately: clang-format output differs between releases, and an apt
      # version that disagrees with .clang-format would reflow the whole tree on an
      # unrelated PR. Bump this in the same commit as a tree-wide reformat.
      - name: Install the pinned clang-format
        run: python3 -m pip install clang-format==23.1.3

      - name: Check formatting
        run: ./scripts/format.sh --check

  # Repository hygiene: no committed model weights, databases, credentials or
  # private configuration, no broken relative doc links, and README/docs
  # invariants (every referenced image exists, required sections present).
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Run checks
        run: python3 scripts/check_repo_hygiene.py

      # The committed diagrams are generated. --check is dependency-free on purpose: it
      # proves the images are present, and a rename that would break a box fails on the
      # next render (render_diagrams.py validates the tree while it draws).
      - name: Generated images are present
        run: |
          python3 docs/images/render_diagrams.py --check
          python3 docs/images/render_detection_overlay.py --check

  # A full build needs CUDA, TensorRT and the non-distributed log-entry package,
  # so it is manual-only here and expected to run on a self-hosted GPU runner.
  gpu-build:
    name: Build (CUDA/TensorRT, self-hosted)
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, gpu, linux, x64]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - name: Conan
        run: |
          python3 -m pip install --upgrade conan
          conan profile detect --exist-ok
          conan create conan/recipes/byte-track
          conan create conan/recipes/log-factory
          conan create conan/recipes/tensorrt-runtime
          conan install . --output-folder=build --build=missing

      - name: Configure and build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=build/conan_toolchain.cmake
          cmake --build build -j"$(nproc)"

      - name: Smoke test the binaries
        run: |
          ./build/faceauth --version
          ./build/faceauth-admin --version

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure || true
