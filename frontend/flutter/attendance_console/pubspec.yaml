name: attendance_console
description: >-
  FaceAuthentication admin console — a Flutter web dashboard for the
  C++/TensorRT face-recognition attendance backend (REST mode only).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  # State management & DI (Riverpod 3, no code generation)
  flutter_riverpod: ^3.4.3

  # URL-based routing with deep links (official Flutter router)
  go_router: ^18.1.1

  # Charts
  fl_chart: ^1.3.0

  # REST client
  http: ^1.2.0

  # Persisted settings (server URL, theme mode, locale)
  shared_preferences: ^2.2.2

  # Jalali (Persian) calendar for date display & picking
  shamsi_date: ^1.1.1

  # File picking (person profile photo upload) — web supported
  file_picker: ^11.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/

  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
          weight: 400
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
