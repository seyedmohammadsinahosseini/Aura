server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API requests to the backend, which runs on the HOST network
    # (required for LAN camera discovery). `host.docker.internal` is mapped
    # to the host IP via `extra_hosts: host-gateway` in docker-compose.yml.
    location /api/ {
        proxy_pass http://host.docker.internal:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Camera discovery (deep network scan) can take a few minutes;
        # nginx's default proxy_read_timeout of 60s would abort it mid-scan
        # and the UI would receive an empty/504 response.
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Flutter Web SPA routing: always serve index.html for unknown paths
    # so that client-side routing handles navigation
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Entry/boot files change on EVERY build (not content-hashed) — never
    # give them a long/implicit cache or browsers keep serving old builds.
    location ~* ^/(index\.html|main\.dart\.js|flutter\.js|flutter\_bootstrap\.js|flutter\_service\_worker\.js|version\.json|manifest\.json)$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Content-hashed static assets (fonts, icons, wasm shaders) can be cached forever
    location ~* \.(css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|otf|wasm)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Gzip compression for text-based assets
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml+rss text/javascript application/vnd.ms-fontobject application/x-font-ttf font/opentype image/svg+xml;
    gzip_min_length 256;
}
