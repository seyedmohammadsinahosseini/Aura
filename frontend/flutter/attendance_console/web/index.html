<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="FaceAuthentication — real-time face recognition attendance console">
  <meta name="theme-color" content="#09090B">

  <!-- PWA -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="FaceAuth">
  <link rel="manifest" href="manifest.json">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">

  <title>FaceAuthentication</title>

  <style>
    /* Minimal boot loader — Flutter replaces the whole body content. */
    html, body { margin: 0; height: 100%; background: #09090B; }
    #boot {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      color: #52525B;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      direction: ltr;
    }
    #boot .spinner {
      width: 28px; height: 28px;
      margin-inline-end: 12px;
      border: 3px solid #27272A;
      border-top-color: #818CF8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="boot">
    <div class="spinner"></div>
    <span>Loading…</span>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
